name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-arm64
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            name: macos-x64
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            name: windows-x64
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: build-${{ github.run_number }}
          releaseName: AiPanel build ${{ github.run_number }}
          releaseBody: |
            自动构建自 `${{ github.sha }}`

            ${{ github.event.head_commit.message || '手动触发' }}

            macOS 安装包为 ad-hoc 签名（未公证），首次打开可能需在「系统设置 → 隐私与安全性」中允许。
            Windows 安装包未签名，SmartScreen 可能提示。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          retryAttempts: 3
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
